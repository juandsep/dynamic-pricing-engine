[project]
name = "dp"
version = "0.1.0"
description = "Real-time dynamic pricing engine: Thompson Sampling over a feature store to maximize LTV."
readme = "README.md"
authors = [
    { name = "jd", email = "juandsep@gmail.com" }
]
requires-python = ">=3.11"
# What the API image installs: serving only. The data pipeline and tracking live in
# the `pipeline` group, so the image carries no DuckDB, pandas or MLflow.
dependencies = [
    "azure-cosmos>=4.17.1",
    "azure-identity>=1.26.0",
    "fastapi>=0.142.0",
    "numpy>=2.4.6",
    "prometheus-client>=0.26.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
dp = "dp:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
pipeline = [
    "duckdb>=1.5.6",
    "mlflow>=3.16.1",
    "pandas>=2.3.3",
    "pyarrow>=19.0.0",
]
dev = [
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "pre-commit>=3.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.6.0",
]

[tool.uv]
# `uv sync` installs everything for development and CI; the image opts out.
default-groups = ["pipeline", "dev"]

[tool.ruff]
line-length = 88

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
]
