[project]
name = "dp"
version = "0.1.0"
description = "Real-time dynamic pricing engine: Thompson Sampling over a feature store to maximize LTV."
readme = "README.md"
authors = [
    { name = "jd", email = "juandsep@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.105",
    "fastapi>=0.142.0",
    "feast>=0.66.0",
    "mlflow>=3.16.1",
    "numpy>=2.4.6",
    "pandas>=2.3.3",
    "redis>=8.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
dp = "dp:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pre-commit>=3.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 88

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
]
